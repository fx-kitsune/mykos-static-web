name: Kiểm tra trang tĩnh
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
      - name: Chuẩn bị Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kiểm tra tài nguyên và tương tác
        run: npm run check
      - name: Tạo bản tĩnh
        run: npm run build
